<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karsa - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/vendor/aos/aos.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/scroll-restore.js"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body class="hg-body db-page">

<!-- Navbar (Dashboard di-highlight saat login via auth.js) -->
<nav class="hg-navbar">
  <div class="hg-nav-inner">
    <a href="index.html" class="hg-logo">Karsa</a>
    <button class="hg-burger" aria-label="Menu" aria-expanded="false" onclick="toggleBurger(this)"><span></span><span></span><span></span></button>
    <div class="hg-nav-links" data-auth-links>
      <a href="index.html" class="hg-nav-link" data-nav="beranda">Beranda</a>
      <a href="simulasi.html" class="hg-nav-link" data-nav="simulasi">Simulasi</a>
      <a href="metodologi.html" class="hg-nav-link" data-nav="tentang">Metodologi</a>
      <a href="dashboard.html" class="hg-nav-link active" data-nav="dashboard" data-auth-dash>Dashboard</a>
      <a href="login.html" class="hg-login" data-auth-btn>Login</a>
    </div>
  </div>
</nav>

<!-- Hero -->
<header class="db-hero" data-aos="fade-up">
  <h1>DASHBOARD</h1>
  <p id="dbGreet">Halo,</p>
</header>

<main class="db-wrap">

  <!-- Statistik -->
  <section class="db-stats" data-aos="fade-up">
    <div class="db-stat">
      <b id="statTotal">0</b>
      <span>Total simulasi</span>
    </div>
    <div class="db-stat">
      <b id="statCustom">0</b>
      <span>Persona custom</span>
    </div>
    <div class="db-stat">
      <b id="statLast">-</b>
      <span>Simulasi terakhir</span>
    </div>
  </section>

  <!-- Info profil -->
  <section class="db-panel" data-aos="fade-up">
    <div class="db-panel-head"><h2>INFO PROFIL</h2></div>
    <div class="db-profile">
      <div class="db-avatar" id="dbAvatar">A</div>
      <div class="db-profile-text">
        <b id="dbName">-</b>
        <span id="dbEmail">-</span>
        <span id="dbJoined">-</span>
      </div>
      <button class="db-btn" id="editProfileBtn" type="button">Edit Profil</button>
    </div>
  </section>

  <!-- Riwayat simulasi -->
  <section class="db-panel" data-aos="fade-up">
    <div class="db-panel-head db-head-split">
      <h2>RIWAYAT SIMULASI</h2>
      <button class="db-btn db-btn-compare" id="compareBtn" type="button" disabled>Bandingkan (0)</button>
    </div>
    <div class="db-list" id="historyList"></div>
  </section>

  <!-- Persona custom -->
  <section class="db-panel" data-aos="fade-up">
    <div class="db-panel-head"><h2>PERSONA CUSTOM</h2></div>
    <div class="db-personas" id="personaGrid"></div>
    <button class="db-add" id="addPersonaBtn" type="button"><span aria-hidden="true">+</span> Buat Persona Baru</button>
  </section>

  <!-- Pengaturan akun -->
  <section class="db-panel" data-aos="fade-up">
    <div class="db-panel-head"><h2>PENGATURAN AKUN</h2></div>
    <div class="db-account">
      <button class="db-btn" id="changePassBtn" type="button">Ubah Password</button>
      <button class="db-btn db-btn-danger" id="wipeBtn" type="button">Hapus Semua Data</button>
    </div>
  </section>

</main>

<!-- Modal generik -->
<div class="db-modal" id="dbModal" hidden>
  <div class="db-modal-card" role="dialog" aria-modal="true" aria-labelledby="dbModalTitle">
    <h3 id="dbModalTitle"></h3>
    <div id="dbModalBody"></div>
    <div class="db-modal-actions" id="dbModalActions"></div>
  </div>
</div>

<!-- Footer -->
<footer class="hg-footer">
  <div class="hg-footer-main">
    <div class="hg-footer-links">
      <a href="index.html" class="hg-foot-link" data-foot="beranda">Beranda</a>
      <a href="simulasi.html" class="hg-foot-link" data-foot="simulasi">Simulasi</a>
      <a href="metodologi.html" class="hg-foot-link" data-foot="tentang">Metodologi</a>
    </div>
    <div class="hg-footer-social">
      <a class="so so-ig" href="#" aria-label="Instagram"><span class="iconify" data-icon="mdi:instagram" data-width="22"></span></a>
      <a class="so so-fb" href="#" aria-label="Facebook"><span class="iconify" data-icon="mdi:facebook" data-width="22"></span></a>
      <a class="so so-x" href="#" aria-label="X"><span class="iconify" data-icon="mdi:close" data-width="20"></span></a>
    </div>
  </div>
  <div class="hg-footer-bar">Copyright &copy; 2026 Karsa. All Right Reserved.</div>
</footer>

<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/animasi.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/to-top.js"></script>
</body>
</html>
