<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karsa - Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/vendor/aos/aos.css">
<script src="assets/js/theme.js"></script>
<script src="assets/js/scroll-restore.js"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body class="hg-body auth-page">

<!-- Navbar (pola login.html, disinkron via auth.js setelah login) -->
<nav class="hg-navbar">
  <div class="hg-nav-inner">
    <a href="index.html" class="hg-logo">Karsa</a>
    <button class="hg-burger" aria-label="Menu" aria-expanded="false" onclick="toggleBurger(this)"><span></span><span></span><span></span></button>
    <div class="hg-nav-links" data-auth-links>
      <a href="index.html" class="hg-nav-link" data-nav="beranda">Beranda</a>
      <a href="simulasi.html" class="hg-nav-link" data-nav="simulasi">Simulasi</a>
      <a href="metodologi.html" class="hg-nav-link" data-nav="tentang">Metodologi</a>
      <a href="login.html" class="hg-login" data-auth-btn>Login</a>
    </div>
  </div>
</nav>

<!-- Hero DAFTAR -->
<header class="auth-hero" data-aos="fade-up">
  <h1>DAFTAR</h1>
</header>

<!-- Form card -->
<main class="auth-wrap">
  <form class="auth-card" id="signupForm" data-aos="zoom-in" novalidate>
    <h2>Buat akun Karsa</h2>
    <p class="auth-sub">Simpan riwayat simulasi dan persona custom-mu.</p>

    <label class="auth-field" for="suEmail">
      <span>Gmail</span>
      <input type="email" id="suEmail" name="email" inputmode="email" autocomplete="email"
        placeholder="nama@gmail.com" required>
    </label>

    <label class="auth-field" for="suName">
      <span>Username</span>
      <input type="text" id="suName" name="username" autocomplete="username"
        placeholder="Pilih username" required>
    </label>

    <label class="auth-field" for="suPassword">
      <span>Password</span>
      <span class="auth-pass-wrap">
        <input type="password" id="suPassword" name="password" autocomplete="new-password"
          placeholder="Buat password" required minlength="8">
        <button type="button" class="auth-peek" id="peekBtn1" aria-label="Tampilkan password">Lihat</button>
      </span>
    </label>
    <p class="auth-hint">Minimal 8 karakter.</p>

    <label class="auth-field" for="suConfirm">
      <span>Konfirmasi Password</span>
      <span class="auth-pass-wrap">
        <input type="password" id="suConfirm" name="confirm" autocomplete="new-password"
          placeholder="Ulangi password" required minlength="8">
        <button type="button" class="auth-peek" id="peekBtn2" aria-label="Tampilkan konfirmasi password">Lihat</button>
      </span>
    </label>

    <p class="auth-err" id="signupErr" role="alert" hidden></p>

    <button type="submit" class="auth-submit">Buat Akun</button>

    <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </form>
</main>

<!-- Footer (pola hg-footer existing) -->
<footer class="hg-footer">
  <div class="hg-footer-main">
    <div class="hg-footer-links">
      <a href="index.html" class="hg-foot-link" data-foot="beranda">Beranda</a>
      <a href="simulasi.html" class="hg-foot-link" data-foot="simulasi">Simulasi</a>
      <a href="metodologi.html" class="hg-foot-link" data-foot="tentang">Metodologi</a>
    </div>
    <div class="hg-footer-social">
      <a class="so so-ig" href="#" aria-label="Instagram"><span class="iconify" data-icon="mdi:instagram" data-width="22"></span></a>
      <a class="so so-fb" href="#" aria-label="Facebook"><span class="iconify" data-icon="mdi:facebook" data-width="22"></span></a>
      <a class="so so-x" href="#" aria-label="X"><span class="iconify" data-icon="mdi:close" data-width="20"></span></a>
    </div>
  </div>
  <div class="hg-footer-bar">Copyright &copy; 2026 Karsa. All Right Reserved.</div>
</footer>

<script src="assets/vendor/aos/aos.js"></script>
<script src="assets/js/animasi.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/to-top.js"></script>
</body>
</html>
