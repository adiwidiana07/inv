<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Data Dasar - Karsa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="input-page">

<!-- Referensi desain: assets/img/ref-input-header.png -->
<section class="header-section">
  <h1 class="header-title">INPUT DATA<br>DASAR</h1>
</section>

<!-- Referensi desain: assets/img/ref-input-form.png -->
<section class="form-section">
  <div class="form-inner">
    <div class="field">
      <label for="gaji">Gaji Bulanan</label>
      <div class="input-row">
        <input type="number" id="gaji" placeholder="Masukan Input">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8zm12 4a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></div>
      </div>
    </div>
    <div class="field">
      <label for="biaya">Estimasi Biaya Hidup Bulanan</label>
      <div class="input-row">
        <input type="number" id="biaya" placeholder="Masukan Input">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-2-7a6 6 0 0 0 9.2 5.1A8 8 0 0 0 10 6.5a6 6 0 0 0 0 6.5z"/></svg></div>
      </div>
    </div>
    <div class="field">
      <label for="target">Target Tabungan Bulanan</label>
      <div class="input-row">
        <input type="number" id="target" placeholder="Masukan Input">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M19 11a3 3 0 0 0-1-.2V9a1 1 0 0 0-1-1h-1V7a1 1 0 0 0-1.5-.86L12 7.6V7a4 4 0 0 0-4 4H6a2 2 0 0 0 0 4h.7A3 3 0 0 0 9 17h6a3 3 0 0 0 3-3v-1.2A3 3 0 0 0 19 11zm-1 3a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-1h10v1z"/></svg></div>
      </div>
    </div>
    <div class="field">
      <label for="investasi">Investasi Karir (Sertifikasi/Kursus)</label>
      <div class="input-row">
        <input type="number" id="investasi" placeholder="Masukan Input">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9.5l2 2v-2H19a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 7h6v2H7zm0 4h4v2H7z"/></svg></div>
      </div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="kenaikan">Proyeksi Kenaikan Gaji / Tahun</label>
      <div class="input-row">
        <input type="number" id="kenaikan" placeholder="Masukan Input">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M3 17h2v4H3zm4-2h2v6H7zm4-4h2v10h-2zm4-4h2v14h-2zm5-6h4v2h-4z"/></svg></div>
      </div>
    </div>
  </div>
</section>

<!-- Referensi desain: assets/img/ref-input-personal.png -->
<section class="personal-section">
  <div class="personal-inner">
    <div class="personal-top">
      <div class="toggles">
        <div>
          <div class="toggle-label">Status Tinggal</div>
          <div class="switch tinggal" id="switchTinggal" onclick="toggleSwitchInput(this)"><div class="knob"></div></div>
          <div style="font-size:11px;margin-top:6px" id="labelTinggal">Kos / Sendiri</div>
        </div>
        <div>
          <div class="toggle-label">Ada Tanggungan</div>
          <div class="switch tanggungan" id="switchTanggungan" onclick="toggleSwitchInput(this)"><div class="knob"></div></div>
          <div style="font-size:11px;margin-top:6px" id="labelTanggungan">Tidak ada</div>
        </div>
      </div>
      <div class="dropdown-wrap">
        <button class="dropdown-btn" id="dropdownBtn" onclick="toggleDropdownInput()">Jenis Pekerjaan <span>▼</span></button>
        <div class="dropdown-list" id="dropdownList">
          <div data-value="tetap" onclick="selectJobInput(this)">Karyawan Tetap</div>
          <div data-value="kontrak" onclick="selectJobInput(this)">Kontrak / Freelance</div>
          <div data-value="wirausaha" onclick="selectJobInput(this)">Wirausaha</div>
        </div>
        <input type="hidden" id="jenisKerja" value="tetap">
      </div>
    </div>
    <button class="btn-kalkulasi" onclick="kalkulasiInput()">Kakulasi Sekarang</button>
    <div class="input-result-box" id="resultBox">
      <h3 style="color:#3D6B4F">Hasil Kalkulasi</h3>
      <p id="resultText"></p>
    </div>
  </div>
</section>

<footer class="footer-input">
  <a href="index.html"><span class="arrow">←</span> KEMBALI</a>
  <div class="logo">Karsa</div>
  <a href="hasil.html">NEXT <span class="arrow">→</span></a>
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
